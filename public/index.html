<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaBank</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 1rem; padding: 2.5rem; max-width: 480px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 1.75rem; }
    p { color: #94a3b8; margin: 0 0 1.5rem; }
    a { display: inline-block; background: #2563eb; color: #fff; padding: .75rem 1.25rem; border-radius: .5rem; text-decoration: none; font-weight: 600; }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>NovaBank</h1>
    <p>La aplicación se sirve desde el frontend.</p>
    <a href="http://localhost:3001">Abrir dashboard</a>
  </div>
</body>
</html>
