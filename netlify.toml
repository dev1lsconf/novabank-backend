[build]
  command = "npm run build:netlify"
  functions = "dist/netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "nft"

[[redirects]]
  from = "/docs"
  to = "/.netlify/functions/api/docs"
  status = 200
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/.netlify/functions/api/docs/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/docs-json"
  to = "/.netlify/functions/api/docs-json"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"